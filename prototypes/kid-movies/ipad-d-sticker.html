<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPad D — Sticker Book</title>
<link rel="stylesheet" href="shared/flat.css">
<style>
  /* Paper. Thick ink outlines. Hard offset shadows, like stickers on card. */
  .tablet {
    --page: #e9dcff;
    --surface: #ffffff;
    --surface-2: #d6bdff;
    --line: #2e1065;
    --text: #2e1065;
    --text-2: rgba(46, 16, 101, .72);
    --text-3: rgba(46, 16, 101, .5);
    --accent: #7c3aed;
    color: var(--text);
    background:
      repeating-linear-gradient(90deg, rgba(46,16,101,.07) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(0deg, rgba(46,16,101,.07) 0 1px, transparent 1px 34px),
      var(--page);
  }

  .ink { border: 3px solid var(--line); box-shadow: 5px 6px 0 var(--line); }
  .ink-sm { border: 3px solid var(--line); box-shadow: 3px 4px 0 var(--line); }

  .tablet .poster { border: 3px solid var(--line); border-radius: 14px; }
  .tablet .rating { border: 2.5px solid var(--line); border-radius: 8px; }
  .tablet .rating.g { background: #4bbf6b; color: #10240f; }
  .tablet .rating.pg { background: #ffc94d; color: #3a2a00; }
  .tablet .kind { background: #fff; border: 2.5px solid var(--line); color: var(--text); border-radius: 8px; }
  .tablet .home-bar { background: rgba(46,16,101,.34); }
  .tablet .w:hover { background: #e9d5ff; }
  .tablet .w.on { background: #c084fc; color: #2e1065; }

  .tablet .big-heart {
    background: #fff; border: 3px solid var(--line); color: rgba(46,16,101,.28);
    box-shadow: 3px 4px 0 var(--line);
  }
  .tablet .big-heart.on { background: #d946ef; color: #fff; }
  .tablet .big-heart:active { transform: translate(3px, 4px); box-shadow: 0 0 0 var(--line); }

  .tablet .speak {
    background: #c9b3ff; color: var(--text);
    border: 3px solid var(--line); border-radius: 16px; box-shadow: 4px 5px 0 var(--line);
  }
  .tablet .speak:active { transform: translate(4px, 5px); box-shadow: 0 0 0 var(--line); }
  .tablet .speak.playing { background: #c084fc; }

  .tablet .play-big {
    background: var(--accent); color: #fff;
    border: 3px solid var(--line); border-radius: 16px; box-shadow: 4px 5px 0 var(--line);
  }
  .tablet .play-big:active { transform: translate(4px, 5px); box-shadow: 0 0 0 var(--line); }

  /* ---------- header ---------- */
  .head {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 16px;
    padding: 4px 26px 12px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
    padding: 9px 20px 9px 14px; border-radius: 18px; background: #c084fc;
  }
  .logo .m { font-size: 27px; }
  .logo b { font-size: var(--t-title); font-weight: 850; letter-spacing: -.6px; }
  .head-spacer { flex: 1; }

  .searchbar {
    display: flex; align-items: center; gap: 13px;
    width: 400px; height: 62px; padding: 0 22px;
    border-radius: 18px; background: #fff;
  }
  .searchbar .mg { font-size: var(--t-title); }
  .searchbar input {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: var(--text); font-size: var(--t-body); font-family: inherit; font-weight: 620;
  }
  .searchbar input::placeholder { color: var(--text-3); font-weight: 500; }

  /* ---------- tabs as paper tabs ---------- */
  .tabs { display: flex; gap: 12px; padding: 0 26px 14px; flex: 0 0 auto; }
  .tab {
    display: flex; align-items: center; gap: 11px;
    height: 64px; padding: 0 24px; border-radius: 18px;
    background: #fff; font-size: var(--t-label); font-weight: 760;
    cursor: pointer; user-select: none;
    border: 3px solid var(--line); box-shadow: 4px 5px 0 var(--line);
    transition: transform 160ms var(--ease), box-shadow 160ms var(--ease), background 200ms;
  }
  .tab .ico { font-size: var(--t-title); line-height: 1; }
  .tab:active { transform: translate(4px, 5px); box-shadow: 0 0 0 var(--line); }
  .tab.on { background: #c084fc; }
  .tab .count {
    display: grid; place-items: center; min-width: 30px; height: 30px; padding: 0 8px;
    border-radius: 8px; background: var(--line); color: #fff; font-size: var(--t-small); font-weight: 800;
  }

  /* ---------- feed ---------- */
  .feed { padding: 2px 26px 26px; }

  .day {
    display: inline-flex; align-items: center; gap: 14px;
    margin: 22px 0 14px; padding: 10px 20px;
    border-radius: 16px; background: #c9b3ff;
    border: 3px solid var(--line); box-shadow: 4px 5px 0 var(--line);
  }
  .feed > .day:first-child { margin-top: 4px; }
  .day .d { font-size: var(--t-title); font-weight: 840; letter-spacing: -.5px; }
  .day .n {
    padding: 4px 12px; border-radius: 9px; background: var(--line); color: #fff;
    font-size: var(--t-small); font-weight: 780;
  }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    display: flex; align-items: center; gap: 18px;
    padding: 14px 16px; border-radius: 24px; background: #fff;
    cursor: pointer;
    transition: transform 160ms var(--ease), box-shadow 160ms var(--ease);
  }
  .card:active { transform: translate(5px, 6px); box-shadow: 0 0 0 var(--line); }
  .card .poster { width: 104px; height: 156px; font-size: 22px; }
  .c-info { flex: 1; min-width: 0; }
  .c-title {
    font-size: var(--t-title); font-weight: 830; letter-spacing: -.4px; line-height: 1.24;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .c-when { margin-top: 9px; font-size: var(--t-body); font-weight: 800; color: #c33a26; }
  .c-tags { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .card .big-heart { width: 58px; height: 58px; font-size: 26px; }

  /* ---------- sheet ---------- */
  .scrim {
    position: absolute; inset: 0; z-index: 80; background: rgba(22,18,30,.5);
    opacity: 0; pointer-events: none; transition: opacity 320ms var(--ease);
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute; z-index: 82; top: 26px; bottom: 26px; right: 24px;
    width: 560px; border-radius: 30px; background: #fff;
    border: 3px solid var(--line); box-shadow: 7px 8px 0 var(--line);
    transform: translateX(calc(100% + 40px));
    transition: transform 460ms var(--ease);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .sheet.on { transform: none; }
  .s-top { display: flex; gap: 20px; padding: 24px 24px 18px; }
  .s-top .poster { width: 168px; height: 252px; font-size: 34px; }
  .s-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .s-title { font-size: 34px; font-weight: 860; letter-spacing: -1px; line-height: 1.1; }
  .s-when { margin-top: 12px; font-size: var(--t-title); font-weight: 830; color: #c33a26; }
  .s-date { margin-top: 4px; font-size: var(--t-label); color: var(--text-2); }
  .s-tags { margin-top: 14px; display: flex; gap: 9px; flex-wrap: wrap; }
  .s-close {
    position: absolute; top: 18px; right: 18px; z-index: 5;
    width: 50px; height: 50px; border-radius: 50%; background: #fff;
    border: 3px solid var(--line); box-shadow: 3px 4px 0 var(--line);
    display: grid; place-items: center; font-size: var(--t-body); cursor: pointer;
  }
  .s-close:active { transform: translate(3px, 4px); box-shadow: 0 0 0 var(--line); }
  .s-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; padding: 0 24px 20px; }
  .s-body::-webkit-scrollbar { display: none; }
  .s-shead { display: flex; align-items: center; gap: 14px; margin: 6px 0 14px; }
  .s-hint { font-size: var(--t-small); color: var(--text-3); line-height: 1.4; }
  .s-story { color: var(--text); }
  .s-foot {
    flex: 0 0 auto; display: flex; align-items: center; gap: 14px;
    padding: 16px 24px 22px; border-top: 3px solid var(--line); background: #f3e9d5;
  }
  .s-favword { font-size: var(--t-body); font-weight: 760; flex: 1; }
</style>
</head>
<body>
<div class="tablet-stage">
<div>
  <div class="tablet">
    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons"><span class="sig"></span>100%<span class="batt"></span></span>
      </div>

      <div class="head">
        <div class="logo ink-sm"><span class="m">🎟️</span><b>Movie Days</b></div>
        <div class="head-spacer"></div>
        <div class="searchbar ink-sm">
          <span class="mg">🔍</span>
          <input id="search" placeholder="Find a movie" autocomplete="off">
        </div>
      </div>

      <div class="tabs" id="tabs"></div>

      <div class="scroll"><div class="feed" id="feed"></div></div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet">
      <div class="s-close" id="sClose">✕</div>
      <div class="s-top" id="sTop"></div>
      <div class="s-body" id="sBody"></div>
      <div class="s-foot" id="sFoot"></div>
    </div>

    <div class="home-bar"></div>
  </div>

  <div class="caption">
    <b>iPad D · Sticker Book</b>
    No glass at all. Cream paper, thick ink outlines and hard drop shadows, so every
    button looks like a sticker you can press. Buttons physically push down when tapped.
    <a href="index.html">← back to all prototypes</a>
  </div>
</div>
</div>

<script src="shared/data.js"></script>
<script src="shared/reader.js"></script>
<script>
(() => {
  Favorites.load();

  const TABS = [
    { id: 'soon', ic: '🎬', lb: 'Coming soon' },
    { id: 'favs', ic: '❤️', lb: 'My favorites' },
  ];
  const state = { tab: 'soon', query: '' };
  const sorted = MOVIES.slice().sort((a, b) => a.date.localeCompare(b.date));

  const el = {
    tabs: document.getElementById('tabs'),
    feed: document.getElementById('feed'),
    search: document.getElementById('search'),
    scrim: document.getElementById('scrim'),
    sheet: document.getElementById('sheet'),
    sTop: document.getElementById('sTop'),
    sBody: document.getElementById('sBody'),
    sFoot: document.getElementById('sFoot'),
  };

  for (const t of TABS) {
    const n = document.createElement('div');
    n.className = 'tab';
    n.dataset.tab = t.id;
    n.innerHTML = `<span class="ico">${t.ic}</span><span>${t.lb}</span>` +
      (t.id === 'favs' ? '<span class="count" id="favCount"></span>' : '');
    n.addEventListener('click', () => {
      state.tab = t.id;
      state.query = '';
      el.search.value = '';
      sync();
      render();
    });
    el.tabs.appendChild(n);
  }
  function sync() {
    for (const n of el.tabs.querySelectorAll('.tab')) n.classList.toggle('on', n.dataset.tab === state.tab);
    const c = document.getElementById('favCount');
    if (c) c.textContent = sorted.filter((m) => Favorites.has(m.id)).length;
  }

  el.search.addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  function pool() {
    let list = sorted;
    if (state.tab === 'favs') list = list.filter((m) => Favorites.has(m.id));
    if (state.query) {
      list = list.filter((m) =>
        m.title.toLowerCase().includes(state.query) ||
        m.kind.toLowerCase().includes(state.query) ||
        m.genres.join(' ').toLowerCase().includes(state.query));
    }
    return list;
  }

  function cardNode(m, delay, showWhen) {
    const n = document.createElement('div');
    n.className = 'card ink rise';
    n.style.animationDelay = delay + 'ms';
    n.innerHTML = `
      <div class="poster" style="${posterStyle(m)}">
        <div class="poster-emoji">${m.emoji}</div>
        <div class="poster-title">${m.title}</div>
      </div>
      <div class="c-info">
        <div class="c-title">${m.title}</div>
        ${showWhen ? `<div class="c-when">${sleepsLabel(m.date)}</div>` : ''}
        <div class="c-tags">
          <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
          <span class="kind"><span>${m.kindIcon}</span>${m.kind}</span>
        </div>
      </div>
      <div class="big-heart ${Favorites.has(m.id) ? 'on' : ''}">${Favorites.has(m.id) ? '♥' : '♡'}</div>`;

    const h = n.querySelector('.big-heart');
    h.addEventListener('click', (e) => {
      e.stopPropagation();
      const on = Favorites.toggle(m.id);
      h.classList.toggle('on', on);
      h.textContent = on ? '♥' : '♡';
      h.classList.remove('pop'); void h.offsetWidth; h.classList.add('pop');
      sync();
      if (state.tab === 'favs') setTimeout(render, 380);
    });
    n.addEventListener('click', () => openSheet(m));
    return n;
  }

  function render() {
    el.feed.innerHTML = '';
    const list = pool();

    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      const [a, b, c] = state.query
        ? ['🔍', 'No movies found', 'Try another word.']
        : ['♡', 'No favorites yet', 'Tap a heart to save a movie here.'];
      e.innerHTML = `<div class="empty-emoji">${a}</div><div class="empty-title">${b}</div><div class="empty-sub">${c}</div>`;
      el.feed.appendChild(e);
      return;
    }

    let i = 0;
    if (state.tab !== 'soon' || state.query) {
      const g = document.createElement('div');
      g.className = 'cards';
      g.style.paddingTop = '6px';
      for (const m of list) g.appendChild(cardNode(m, i++ * 30, true));
      el.feed.appendChild(g);
      return;
    }

    for (const day of groupByDate(list)) {
      const h = document.createElement('div');
      h.className = 'day';
      h.innerHTML = `<span class="d">${formatDateLong(day.key)}</span>
        <span class="n">${sleepsLabel(day.key)}</span>`;
      el.feed.appendChild(h);
      const g = document.createElement('div');
      g.className = 'cards';
      for (const m of day.items) g.appendChild(cardNode(m, i++ * 30, false));
      el.feed.appendChild(g);
    }
  }

  /* ---------- sheet ---------- */
  function openSheet(m) {
    ReadAloud.stop();
    const on = Favorites.has(m.id);

    el.sTop.innerHTML = `
      <div class="poster" style="${posterStyle(m)}">
        <div class="poster-emoji">${m.emoji}</div>
        <div class="poster-title">${m.title}</div>
      </div>
      <div class="s-meta">
        <div class="s-title">${m.title}</div>
        <div class="s-when">${sleepsLabel(m.date)}</div>
        <div class="s-date">${formatDateLong(m.date)}</div>
        <div class="s-tags">
          <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
          <span class="kind"><span>${m.kindIcon}</span>${m.kind}</span>
        </div>
      </div>`;

    el.sBody.innerHTML = `
      <div class="play-big" id="playBtn" style="width:100%;justify-content:center;margin-bottom:20px">
        <span style="font-size:21px">▶</span>Play trailer
      </div>
      <div class="s-shead">
        <div class="speak" id="speakBtn"><span class="ico">🔊</span>Read it to me</div>
        <div class="s-hint">Tap any word<br>to hear it</div>
      </div>
      <p class="s-story reading" id="story"></p>`;

    el.sFoot.innerHTML = `
      <div class="big-heart ${on ? 'on' : ''}" id="sHeart">${on ? '♥' : '♡'}</div>
      <div class="s-favword" id="favWord">${on ? 'Saved to my favorites' : 'Tap the heart to save it'}</div>`;

    ReadAloud.prepare(el.sBody.querySelector('#story'), m.simple);

    const speak = el.sBody.querySelector('#speakBtn');
    const stopReading = () => {
      speak.classList.remove('playing');
      speak.innerHTML = '<span class="ico">🔊</span>Read it to me';
    };
    speak.addEventListener('click', () => {
      if (speak.classList.contains('playing')) { ReadAloud.stop(); stopReading(); return; }
      speak.classList.add('playing');
      speak.innerHTML = '<span class="ico">⏸</span>Stop reading';
      ReadAloud.speak(`${m.title}. ${m.simple}`, { onEnd: stopReading });
    });

    const play = el.sBody.querySelector('#playBtn');
    play.addEventListener('click', () => {
      play.innerHTML = '<span style="font-size:21px">⏸</span>Playing trailer…';
    });

    const heart = el.sFoot.querySelector('#sHeart');
    const word = el.sFoot.querySelector('#favWord');
    heart.addEventListener('click', () => {
      const nowOn = Favorites.toggle(m.id);
      heart.classList.toggle('on', nowOn);
      heart.textContent = nowOn ? '♥' : '♡';
      heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop');
      word.textContent = nowOn ? 'Saved to my favorites' : 'Tap the heart to save it';
      sync();
      render();
    });

    el.scrim.classList.add('on');
    el.sheet.classList.add('on');
  }

  function closeSheet() {
    ReadAloud.stop();
    el.scrim.classList.remove('on');
    el.sheet.classList.remove('on');
  }
  document.getElementById('sClose').addEventListener('click', closeSheet);
  el.scrim.addEventListener('click', closeSheet);

  sync();
  render();
  fitFrame('.tablet', 1180);
})();
</script>
</body>
</html>
