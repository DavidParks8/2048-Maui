<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype C — Countdown Calendar</title>
<link rel="stylesheet" href="shared/glass.css">
<style>
  body { background: #17092e; }

  /* Light "frosted" liquid glass over a bright wallpaper. */
  .wallpaper {
    background:
      radial-gradient(70% 55% at 8% 2%, #d8c2ff 0%, transparent 60%),
      radial-gradient(75% 55% at 96% 12%, #c4b0ff 0%, transparent 62%),
      radial-gradient(85% 60% at 50% 102%, #e9d5ff 0%, transparent 60%),
      linear-gradient(172deg, #faf5ff 0%, #ece2fd 55%, #f6efff 100%);
  }
  .wallpaper::after { opacity: .10; }

  .screen { color: #2e1065; }
  .status-bar { color: #2e1065; }
  .home-bar { background: rgba(25,26,44,.42); }

  .glass {
    background: linear-gradient(150deg, rgba(255,255,255,.72) 0%, rgba(255,255,255,.42) 48%, rgba(255,255,255,.62) 100%);
    border: .5px solid rgba(255,255,255,.9);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.95),
      inset 0 -1px 1px rgba(255,255,255,.5),
      0 10px 28px rgba(32,30,45,.14);
  }
  .glass::before {
    background: linear-gradient(115deg, transparent 26%, rgba(255,255,255,.75) 45%,
      rgba(255,255,255,.15) 56%, transparent 74%);
    opacity: .5;
  }
  .glass-thin {
    background: linear-gradient(150deg, rgba(255,255,255,.6), rgba(255,255,255,.32));
    border: .5px solid rgba(255,255,255,.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85);
  }

  .rating.g { background: rgba(28,150,70,.16); color: #14743c; border-color: rgba(28,150,70,.3); }
  .rating.pg { background: rgba(200,130,0,.16); color: #8a5a00; border-color: rgba(200,130,0,.3); }
  .empty-title { color: rgba(25,26,44,.72); }
  .empty { color: rgba(25,26,44,.5); }

  /* ---------- header ---------- */
  .hdr { flex: 0 0 auto; padding: 0 22px 6px; position: relative; z-index: 30; }
  .hdr h1 { margin: 0; font-size: 32px; font-weight: 850; letter-spacing: -1px; }
  .hdr p { margin: 3px 0 0; font-size: 13.5px; font-weight: 600; color: rgba(25,26,44,.5); }

  /* ---------- big countdown hero ---------- */
  .countdown {
    margin: 14px 18px 4px;
    padding: 18px;
    border-radius: 30px;
    display: flex; align-items: center; gap: 16px;
    cursor: pointer;
    transition: transform 400ms var(--ease-glass);
  }
  .countdown:active { transform: scale(.98); }
  .countdown > * { position: relative; z-index: 2; }
  .cd-num {
    flex: 0 0 auto; width: 92px; text-align: center;
  }
  .cd-days { font-size: 52px; font-weight: 850; letter-spacing: -3.5px; line-height: .92; }
  .cd-lbl {
    font-size: 11px; font-weight: 800; letter-spacing: 1.6px;
    text-transform: uppercase; color: rgba(25,26,44,.45); margin-top: 4px;
  }
  .cd-info { flex: 1; min-width: 0; }
  .cd-tag {
    display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1.2px;
    text-transform: uppercase; color: rgba(25,26,44,.45); margin-bottom: 5px;
  }
  .cd-title { font-size: 19px; font-weight: 820; letter-spacing: -.6px; line-height: 1.15; }
  .cd-meta { margin-top: 7px; display: flex; align-items: center; gap: 7px; font-size: 12px; color: rgba(25,26,44,.55); }
  .cd-poster { width: 62px; height: 92px; font-size: 14px; }

  /* ---------- calendar ---------- */
  .cal { margin: 14px 18px 0; padding: 14px 14px 12px; border-radius: 28px; }
  .cal > * { position: relative; z-index: 2; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
  .cal-month { font-size: 16px; font-weight: 800; letter-spacing: -.4px; }
  .cal-nav { display: flex; gap: 6px; }
  .cal-btn {
    width: 30px; height: 30px; border-radius: 50%;
    display: grid; place-items: center; font-size: 15px; cursor: pointer;
    background: rgba(255,255,255,.6);
    border: .5px solid rgba(255,255,255,.85);
    color: rgba(25,26,44,.7);
    transition: transform 300ms var(--ease-glass);
  }
  .cal-btn:active { transform: scale(.88); }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-dow {
    text-align: center; font-size: 10px; font-weight: 800; letter-spacing: .5px;
    color: rgba(25,26,44,.38); padding-bottom: 5px;
  }
  .cal-day {
    aspect-ratio: 1; border-radius: 12px;
    display: grid; place-items: center; position: relative;
    font-size: 13px; font-weight: 650; color: rgba(25,26,44,.75);
  }
  .cal-day.blank { visibility: hidden; }
  .cal-day.has { cursor: pointer; font-weight: 800; color: #2e1065; }
  .cal-day.has::after {
    content: ''; position: absolute; bottom: 5px; left: 50%;
    transform: translateX(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: #ff4f7d;
  }
  .cal-day.on {
    background: #2e1065; color: #fff;
  }
  .cal-day.on::after { background: #ffd479; }

  /* ---------- banner rows ---------- */
  .sec-title {
    padding: 22px 26px 8px;
    font-size: 12.5px; font-weight: 850; letter-spacing: 1.4px;
    text-transform: uppercase; color: rgba(25,26,44,.42);
  }
  .banner {
    margin: 0 18px 11px;
    padding: 12px;
    border-radius: 26px;
    display: flex; align-items: center; gap: 13px;
    cursor: pointer;
    transition: transform 380ms var(--ease-glass);
  }
  .banner:active { transform: scale(.977); }
  .banner > * { position: relative; z-index: 2; }
  .banner .poster { width: 60px; height: 88px; font-size: 14px; }
  .bn-info { flex: 1; min-width: 0; }
  .bn-title {
    font-size: 16px; font-weight: 800; letter-spacing: -.4px; line-height: 1.2;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bn-when { margin-top: 6px; font-size: 12.5px; font-weight: 700; color: #d4295c; }
  .bn-meta { margin-top: 5px; display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: rgba(25,26,44,.5); }
  .bn-meta .dot { background: rgba(25,26,44,.3); }
  .fav-btn {
    background: rgba(255,255,255,.62);
    border-color: rgba(255,255,255,.9);
    color: rgba(25,26,44,.42);
  }
  .fav-btn.on { color: #ff2d55; background: rgba(255,45,85,.14); border-color: rgba(255,45,85,.32); }

  /* ---------- search ---------- */
  .searchbar {
    margin: 6px 18px 2px;
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 16px; border-radius: var(--radius-pill);
  }
  .searchbar input {
    flex: 1; border: 0; outline: 0; background: transparent;
    color: #2e1065; font-size: 16px; font-family: inherit; font-weight: 600;
  }
  .searchbar input::placeholder { color: rgba(25,26,44,.38); font-weight: 500; }

  /* ---------- big tab bar ---------- */
  .tabs {
    position: relative; z-index: 45; flex: 0 0 auto;
    margin: 8px 18px 26px; padding: 6px;
    display: flex; gap: 4px; border-radius: 26px;
  }
  .tab {
    flex: 1; position: relative; z-index: 2;
    display: grid; justify-items: center; gap: 2px;
    padding: 9px 0 7px; border-radius: 21px; cursor: pointer;
    color: rgba(25,26,44,.42);
    transition: color 300ms var(--ease-glass);
  }
  .tab .ic { font-size: 20px; line-height: 1; }
  .tab .lb { font-size: 10.5px; font-weight: 800; }
  .tab.on { color: #fff; }
  .tab-pill {
    position: absolute; z-index: 1; top: 6px; bottom: 6px;
    border-radius: 21px; background: #2e1065;
    box-shadow: 0 6px 16px rgba(25,26,44,.28);
    transition: transform 520ms var(--ease-glass);
  }

  /* ---------- detail sheet ---------- */
  .scrim {
    position: absolute; inset: 0; z-index: 70;
    background: rgba(30,25,55,.36);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none;
    transition: opacity 460ms var(--ease-glass);
  }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: absolute; z-index: 80; left: 8px; right: 8px; bottom: 8px;
    height: 80%; border-radius: 38px;
    transform: translateY(105%);
    transition: transform 560ms var(--ease-glass);
    display: flex; flex-direction: column; overflow: hidden;
    color: #2e1065;
  }
  .sheet.on { transform: none; }
  .grabber {
    width: 38px; height: 5px; border-radius: 999px;
    background: rgba(25,26,44,.22); margin: 10px auto 0;
    flex: 0 0 auto; position: relative; z-index: 3;
  }
  .sheet-body { position: relative; z-index: 3; padding: 6px 22px 26px; }
  .big-count {
    text-align: center; padding: 14px 0 4px;
  }
  .big-count .n { font-size: 62px; font-weight: 860; letter-spacing: -4px; line-height: .9; }
  .big-count .l {
    font-size: 11.5px; font-weight: 850; letter-spacing: 1.8px;
    text-transform: uppercase; color: rgba(25,26,44,.45); margin-top: 6px;
  }
  .sheet-hero { display: flex; gap: 15px; padding: 16px 0 12px; align-items: center; }
  .sheet-hero .poster { width: 96px; height: 142px; font-size: 18px; }
  .sheet-title { font-size: 23px; font-weight: 850; letter-spacing: -.8px; line-height: 1.14; }
  .sheet-meta { margin-top: 9px; font-size: 12.5px; color: rgba(25,26,44,.58); line-height: 1.8; }
  .trailer {
    position: relative; height: 158px; border-radius: 22px; overflow: hidden;
    display: grid; place-items: center; cursor: pointer; margin: 8px 0 16px;
  }
  .trailer .pl {
    position: relative; z-index: 3;
    width: 60px; height: 60px; border-radius: 50%;
    display: grid; place-items: center; font-size: 21px; padding-left: 4px;
    color: #fff;
    background: rgba(255,255,255,.24);
    border: .5px solid rgba(255,255,255,.55);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), 0 8px 22px rgba(0,0,0,.3);
    transition: transform 400ms var(--ease-glass);
  }
  .trailer:active .pl { transform: scale(.9); }
  .trailer .cap {
    position: absolute; z-index: 3; bottom: 13px; left: 15px; color: #fff;
    font-size: 12px; font-weight: 750; text-shadow: 0 1px 6px rgba(0,0,0,.55);
  }
  .sheet-text { font-size: 15.5px; line-height: 1.55; color: rgba(25,26,44,.78); margin-bottom: 18px; }
  .sheet-fav {
    height: 54px; border-radius: 18px; display: grid; place-items: center;
    font-size: 16px; font-weight: 800; cursor: pointer; color: #fff;
    background: #ff2d55;
    box-shadow: 0 8px 20px rgba(25,26,44,.2);
    transition: transform 320ms var(--ease-glass);
  }
  .sheet-fav:active { transform: scale(.97); }
  .sheet-fav.off {
    background: rgba(255,255,255,.6);
    border: .5px solid rgba(255,255,255,.9);
    color: #2e1065;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 6px 16px rgba(32,30,45,.12);
  }
</style>
</head>
<body>
<div class="stage">
<div>
  <div class="phone">
    <div class="wallpaper"></div>
    <div class="notch"></div>

    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons"><span class="sig"></span>100%<span class="batt"></span></span></div>

      <div class="hdr">
        <h1 id="hTitle">Coming Soon</h1>
        <p id="hSub">Movies for kids · G &amp; PG only</p>
      </div>

      <div class="scroll" id="content"></div>

      <div class="tabs glass" id="tabs">
        <div class="tab-pill" id="tabPill"></div>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet glass" id="sheet">
      <div class="grabber"></div>
      <div class="scroll"><div class="sheet-body" id="sheetBody"></div></div>
    </div>

    <div class="home-bar"></div>
  </div>

  <div class="caption">
    <b>Prototype C · Countdown Calendar</b>
    Light frosted glass and built for a kid: giant “how many sleeps” counters, a real
    tappable calendar with a dot on every release day, and big friendly rows.
    <a href="index.html">← back to all prototypes</a>
  </div>
</div>
</div>

<script src="shared/data.js"></script>
<script>
(() => {
  Favorites.load();

  const TABS = [
    { id: 'soon', ic: '📅', lb: 'Calendar' },
    { id: 'search', ic: '🔍', lb: 'Search' },
    { id: 'favs', ic: '★', lb: 'My List' },
  ];

  const state = { tab: 'soon', query: '', selected: null, month: '2026-09' };

  const el = {
    tabs: document.getElementById('tabs'),
    pill: document.getElementById('tabPill'),
    content: document.getElementById('content'),
    hTitle: document.getElementById('hTitle'),
    hSub: document.getElementById('hSub'),
    scrim: document.getElementById('scrim'),
    sheet: document.getElementById('sheet'),
    sheetBody: document.getElementById('sheetBody'),
  };

  const sorted = MOVIES.slice().sort((a, b) => a.date.localeCompare(b.date));
  const monthKeys = [...new Set(sorted.map((m) => m.date.slice(0, 7)))];

  for (const t of TABS) {
    const n = document.createElement('div');
    n.className = 'tab';
    n.dataset.tab = t.id;
    n.innerHTML = `<div class="ic">${t.ic}</div><div class="lb">${t.lb}</div>`;
    n.addEventListener('click', () => setTab(t.id));
    el.tabs.appendChild(n);
  }

  function movePill() {
    const a = el.tabs.querySelector('.tab.on');
    if (!a) return;
    el.pill.style.width = a.offsetWidth + 'px';
    el.pill.style.transform = `translateX(${a.offsetLeft - 6}px)`;
  }

  function setTab(id) {
    state.tab = id;
    state.selected = null;
    for (const n of el.tabs.querySelectorAll('.tab')) n.classList.toggle('on', n.dataset.tab === id);
    movePill();
    if (id === 'soon') { el.hTitle.textContent = 'Coming Soon'; el.hSub.textContent = 'Movies for kids · G & PG only'; }
    if (id === 'search') { el.hTitle.textContent = 'Search'; el.hSub.textContent = 'Look for any movie'; }
    if (id === 'favs') { el.hTitle.textContent = 'My List'; el.hSub.textContent = `${Favorites.ids.size} movies you're excited for`; }
    render();
  }

  /* ---------- pieces ---------- */
  function countdownHero(m) {
    const n = document.createElement('div');
    n.className = 'countdown glass rise';
    n.innerHTML = `
      <div class="cd-num">
        <div class="cd-days">${daysUntil(m.date)}</div>
        <div class="cd-lbl">Sleeps</div>
      </div>
      <div class="cd-info">
        <div class="cd-tag">Up next</div>
        <div class="cd-title">${m.title}</div>
        <div class="cd-meta">
          <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
          <span>${formatDate(m.date)}</span>
        </div>
      </div>
      <div class="poster cd-poster" style="${posterStyle(m)}">
        <div class="poster-emoji">${m.emoji}</div>
        <div class="poster-title">${m.title}</div>
      </div>`;
    n.addEventListener('click', () => openSheet(m));
    return n;
  }

  function calendar() {
    const wrap = document.createElement('div');
    wrap.className = 'cal glass rise';
    const [y, mo] = state.month.split('-').map(Number);
    const first = new Date(y, mo - 1, 1);
    const total = new Date(y, mo, 0).getDate();
    const idx = monthKeys.indexOf(state.month);

    const byDay = new Map();
    for (const m of sorted) {
      if (m.date.slice(0, 7) !== state.month) continue;
      const d = parseDate(m.date).getDate();
      if (!byDay.has(d)) byDay.set(d, []);
      byDay.get(d).push(m);
    }

    let cells = '';
    for (const d of ['S', 'M', 'T', 'W', 'T', 'F', 'S']) cells += `<div class="cal-dow">${d}</div>`;
    for (let i = 0; i < first.getDay(); i++) cells += `<div class="cal-day blank"></div>`;
    for (let d = 1; d <= total; d++) {
      const iso = `${state.month}-${String(d).padStart(2, '0')}`;
      const has = byDay.has(d);
      const on = state.selected === iso;
      cells += `<div class="cal-day ${has ? 'has' : ''} ${on ? 'on' : ''}" data-iso="${has ? iso : ''}">${d}</div>`;
    }

    wrap.innerHTML = `
      <div class="cal-head">
        <div class="cal-month">${formatMonth(state.month + '-01')}</div>
        <div class="cal-nav">
          <div class="cal-btn" data-step="-1" ${idx <= 0 ? 'style="opacity:.3"' : ''}>‹</div>
          <div class="cal-btn" data-step="1" ${idx >= monthKeys.length - 1 ? 'style="opacity:.3"' : ''}>›</div>
        </div>
      </div>
      <div class="cal-grid">${cells}</div>`;

    for (const b of wrap.querySelectorAll('.cal-btn')) {
      b.addEventListener('click', () => {
        const next = idx + Number(b.dataset.step);
        if (next < 0 || next >= monthKeys.length) return;
        state.month = monthKeys[next];
        state.selected = null;
        render();
      });
    }
    for (const d of wrap.querySelectorAll('.cal-day.has')) {
      d.addEventListener('click', () => {
        state.selected = state.selected === d.dataset.iso ? null : d.dataset.iso;
        render();
      });
    }
    return wrap;
  }

  function bannerNode(m, delay) {
    const n = document.createElement('div');
    n.className = 'banner glass rise';
    n.style.animationDelay = delay + 'ms';
    n.innerHTML = `
      <div class="poster" style="${posterStyle(m)}">
        <div class="poster-emoji">${m.emoji}</div>
        <div class="poster-title">${m.title}</div>
      </div>
      <div class="bn-info">
        <div class="bn-title">${m.title}</div>
        <div class="bn-when">${daysUntil(m.date)} sleeps · ${formatDate(m.date)}</div>
        <div class="bn-meta">
          <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
          <span class="dot"></span><span>${m.runtime}m</span>
          <span class="dot"></span><span>${m.genres[0]}</span>
        </div>
      </div>
      <div class="fav-btn ${Favorites.has(m.id) ? 'on' : ''}">${Favorites.has(m.id) ? '★' : '☆'}</div>`;

    const f = n.querySelector('.fav-btn');
    f.addEventListener('click', (e) => {
      e.stopPropagation();
      const on = Favorites.toggle(m.id);
      f.classList.toggle('on', on);
      f.textContent = on ? '★' : '☆';
      f.classList.remove('pop'); void f.offsetWidth; f.classList.add('pop');
      if (state.tab === 'favs') setTimeout(render, 340);
      else el.hSub.textContent = 'Movies for kids · G & PG only';
    });
    n.addEventListener('click', () => openSheet(m));
    return n;
  }

  function sectionTitle(t) {
    const n = document.createElement('div');
    n.className = 'sec-title';
    n.textContent = t;
    return n;
  }

  function emptyNode(e1, e2, e3) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.innerHTML = `<div class="empty-emoji">${e1}</div>
      <div class="empty-title">${e2}</div><div class="empty-sub">${e3}</div>`;
    return e;
  }

  function pad() {
    const s = document.createElement('div');
    s.style.height = '16px';
    return s;
  }

  /* ---------- render ---------- */
  function render() {
    el.content.innerHTML = '';

    if (state.tab === 'search') {
      const bar = document.createElement('div');
      bar.className = 'searchbar glass-thin';
      bar.innerHTML = `<span>🔍</span><input placeholder="Search movies" autocomplete="off">`;
      el.content.appendChild(bar);
      const input = bar.querySelector('input');
      input.value = state.query;
      const box = document.createElement('div');
      el.content.appendChild(box);

      const run = () => {
        box.innerHTML = '';
        if (!state.query) {
          box.appendChild(emptyNode('🍿', 'What are you looking for?', 'Try “dragon”, “robot”, or “animation”.'));
          return;
        }
        const hits = sorted.filter((m) =>
          m.title.toLowerCase().includes(state.query) ||
          m.genres.join(' ').toLowerCase().includes(state.query) ||
          m.studio.toLowerCase().includes(state.query));
        if (!hits.length) {
          box.appendChild(emptyNode('🤷', 'Nothing found', 'Try a different word.'));
          return;
        }
        box.appendChild(sectionTitle(`${hits.length} result${hits.length > 1 ? 's' : ''}`));
        let i = 0;
        for (const m of hits) box.appendChild(bannerNode(m, i++ * 35));
        box.appendChild(pad());
      };

      input.addEventListener('input', (e) => { state.query = e.target.value.trim().toLowerCase(); run(); });
      run();
      input.focus();
      return;
    }

    if (state.tab === 'favs') {
      const favs = sorted.filter((m) => Favorites.has(m.id));
      if (!favs.length) {
        el.content.appendChild(emptyNode('☆', 'Your list is empty',
          'Tap the star on any movie to add it here.'));
        return;
      }
      el.content.appendChild(countdownHero(favs[0]));
      el.content.appendChild(sectionTitle('Everything on your list'));
      let i = 0;
      for (const m of favs) el.content.appendChild(bannerNode(m, i++ * 35));
      el.content.appendChild(pad());
      return;
    }

    el.content.appendChild(countdownHero(sorted[0]));
    el.content.appendChild(calendar());

    const list = state.selected
      ? sorted.filter((m) => m.date === state.selected)
      : sorted.filter((m) => m.date.slice(0, 7) === state.month);

    el.content.appendChild(sectionTitle(
      state.selected ? formatDate(state.selected) : `${formatMonth(state.month + '-01')} releases`));

    if (!list.length) {
      el.content.appendChild(emptyNode('📭', 'Nothing this month', 'Try the next month.'));
      return;
    }
    let i = 0;
    for (const m of list) el.content.appendChild(bannerNode(m, i++ * 35));
    el.content.appendChild(pad());
  }

  /* ---------- sheet ---------- */
  function openSheet(m) {
    const on = Favorites.has(m.id);
    el.sheetBody.innerHTML = `
      <div class="big-count">
        <div class="n">${daysUntil(m.date)}</div>
        <div class="l">Sleeps until it opens</div>
      </div>
      <div class="sheet-hero">
        <div class="poster" style="${posterStyle(m)}">
          <div class="poster-emoji">${m.emoji}</div>
          <div class="poster-title">${m.title}</div>
        </div>
        <div>
          <div class="sheet-title">${m.title}</div>
          <div class="sheet-meta">
            <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
            &nbsp; ${m.runtime} min<br>
            ${formatDate(m.date)}, ${m.date.slice(0, 4)}<br>
            ${m.genres.join(' · ')}
          </div>
        </div>
      </div>
      <div class="trailer" style="${posterStyle(m)}">
        <div class="pl">▶</div>
        <div class="cap">Watch the trailer · 2:14</div>
      </div>
      <div class="sheet-text">${m.overview}</div>
      <div class="sheet-fav ${on ? '' : 'off'}" id="sFav">${on ? '★  On my list' : '☆  Add to my list'}</div>`;

    el.sheetBody.querySelector('#sFav').addEventListener('click', (e) => {
      const nowOn = Favorites.toggle(m.id);
      e.currentTarget.classList.toggle('off', !nowOn);
      e.currentTarget.textContent = nowOn ? '★  On my list' : '☆  Add to my list';
      render();
    });
    el.sheetBody.querySelector('.trailer').addEventListener('click', (e) => {
      e.currentTarget.querySelector('.cap').textContent = 'Playing trailer… (YouTube in the real app)';
    });

    el.scrim.classList.add('on');
    el.sheet.classList.add('on');
  }
  el.scrim.addEventListener('click', () => {
    el.scrim.classList.remove('on');
    el.sheet.classList.remove('on');
  });

  setTab('soon');
  window.addEventListener('resize', movePill);
})();
</script>
</body>
</html>
