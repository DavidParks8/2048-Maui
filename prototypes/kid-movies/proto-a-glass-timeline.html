<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A — Glass Timeline</title>
<link rel="stylesheet" href="shared/glass.css">
<style>
  body { background: #14161f; }

  .wallpaper {
    background:
      radial-gradient(75% 55% at 12% 4%, #4a63ff 0%, transparent 58%),
      radial-gradient(85% 60% at 92% 22%, #b44cff 0%, transparent 60%),
      radial-gradient(90% 70% at 50% 104%, #ff5a8a 0%, transparent 58%),
      linear-gradient(178deg, #171a2e 0%, #0d0f1c 100%);
  }

  /* ---------- large title header ---------- */
  .hdr {
    position: relative;
    z-index: 30;
    flex: 0 0 auto;
    padding: 2px 20px 12px;
  }
  .hdr-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .hdr h1 {
    margin: 0;
    font-size: 33px;
    font-weight: 800;
    letter-spacing: -0.9px;
  }
  .hdr-sub {
    margin-top: 3px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.1px;
  }

  /* ---------- filter chips ---------- */
  .chips {
    display: flex;
    gap: 8px;
    padding: 12px 20px 4px;
    flex: 0 0 auto;
    position: relative;
    z-index: 30;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    font-size: 13px;
    font-weight: 650;
    color: var(--text-2);
    cursor: pointer;
    transition: all 300ms var(--ease-glass);
    background: rgba(255,255,255,.09);
    border: .5px solid rgba(255,255,255,.16);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
  }
  .chip.on {
    color: #0b0d18;
    background: rgba(255,255,255,.94);
    border-color: rgba(255,255,255,.9);
    box-shadow: 0 4px 14px rgba(0,0,0,.32);
  }

  /* ---------- sticky month header ---------- */
  .month {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 18px 20px 10px;
    padding: 9px 15px;
    border-radius: var(--radius-pill);
    font-size: 12.5px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,.9);
    background: rgba(255,255,255,.11);
    backdrop-filter: blur(26px) saturate(180%);
    -webkit-backdrop-filter: blur(26px) saturate(180%);
    border: .5px solid rgba(255,255,255,.2);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 6px 18px rgba(0,0,0,.3);
  }

  /* ---------- date group ---------- */
  .date-group { padding: 0 20px; margin-bottom: 4px; }
  .date-head {
    display: flex;
    align-items: baseline;
    gap: 9px;
    padding: 10px 4px 8px;
  }
  .date-head .d { font-size: 16px; font-weight: 750; letter-spacing: -.3px; }
  .date-head .n {
    font-size: 11.5px;
    font-weight: 700;
    color: #ffd479;
    padding: 2.5px 8px;
    border-radius: var(--radius-pill);
    background: rgba(255,212,121,.14);
    border: .5px solid rgba(255,212,121,.28);
  }

  /* ---------- movie row card ---------- */
  .card {
    display: flex;
    gap: 13px;
    align-items: center;
    padding: 11px;
    margin-bottom: 10px;
    border-radius: var(--radius-card);
    cursor: pointer;
    transition: transform 380ms var(--ease-glass);
  }
  .card:active { transform: scale(.975); }
  .card > * { position: relative; z-index: 2; }
  .card .poster { width: 68px; height: 100px; font-size: 15px; }
  .card-info { flex: 1 1 auto; min-width: 0; }
  .card-title {
    font-size: 16px;
    font-weight: 720;
    letter-spacing: -.35px;
    line-height: 1.22;
    margin-bottom: 5px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-meta {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 6px;
  }
  .dot { width: 2.5px; height: 2.5px; border-radius: 50%; background: var(--text-3); }
  .card-genres { font-size: 11.5px; color: var(--text-3); font-weight: 600; }

  /* ---------- search ---------- */
  .search-wrap { padding: 6px 20px 4px; flex: 0 0 auto; position: relative; z-index: 30; }
  .search {
    display: flex;
    align-items: center;
    gap: 9px;
    height: 40px;
    padding: 0 14px;
    border-radius: var(--radius-pill);
  }
  .search input {
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    font-size: 16px;
    font-family: inherit;
  }
  .search input::placeholder { color: var(--text-3); }

  /* ---------- tab bar ---------- */
  .tabs {
    position: relative;
    z-index: 45;
    flex: 0 0 auto;
    margin: 8px 16px 26px;
    padding: 7px;
    display: flex;
    gap: 4px;
    border-radius: 28px;
  }
  .tab {
    flex: 1;
    position: relative;
    z-index: 2;
    display: grid;
    justify-items: center;
    gap: 3px;
    padding: 7px 0 5px;
    border-radius: 22px;
    cursor: pointer;
    color: var(--text-3);
    transition: color 280ms var(--ease-glass);
  }
  .tab .ic { font-size: 19px; line-height: 1; }
  .tab .lb { font-size: 10.5px; font-weight: 700; letter-spacing: .1px; }
  .tab.on { color: #fff; }
  .tab-pill {
    position: absolute;
    z-index: 1;
    top: 7px;
    bottom: 7px;
    border-radius: 22px;
    background: rgba(255,255,255,.20);
    border: .5px solid rgba(255,255,255,.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 4px 14px rgba(0,0,0,.2);
    /* tabs are equal-width flex children, so only transform animates */
    transition: transform 520ms var(--ease-glass);
  }

  /* ---------- detail sheet ---------- */
  .scrim {
    position: absolute; inset: 0; z-index: 70;
    background: rgba(0,0,0,.5);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none;
    transition: opacity 460ms var(--ease-glass);
  }
  .scrim.on { opacity: 1; pointer-events: auto; }

  .sheet {
    position: absolute; z-index: 80;
    left: 0; right: 0; bottom: 0;
    height: 82%;
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    transform: translateY(101%);
    transition: transform 560ms var(--ease-glass);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .sheet.on { transform: none; }
  .grabber {
    width: 38px; height: 5px; border-radius: 999px;
    background: rgba(255,255,255,.4);
    margin: 9px auto 0; flex: 0 0 auto;
    position: relative; z-index: 3;
  }
  .sheet-body { position: relative; z-index: 3; padding: 4px 22px 26px; }
  .sheet-hero { display: flex; gap: 15px; padding: 16px 0 14px; }
  .sheet-hero .poster { width: 108px; height: 158px; font-size: 20px; }
  .sheet-title { font-size: 24px; font-weight: 800; letter-spacing: -.7px; line-height: 1.15; }
  .sheet-meta { margin-top: 8px; font-size: 12.5px; color: var(--text-2); line-height: 1.75; }
  .trailer {
    position: relative;
    height: 152px;
    border-radius: 18px;
    overflow: hidden;
    display: grid; place-items: center;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .trailer-play {
    position: relative; z-index: 3;
    width: 56px; height: 56px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 20px; padding-left: 4px;
    background: rgba(255,255,255,.2);
    border: .5px solid rgba(255,255,255,.45);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 8px 24px rgba(0,0,0,.35);
    transition: transform 400ms var(--ease-glass);
  }
  .trailer:active .trailer-play { transform: scale(.9); }
  .trailer-label {
    position: absolute; z-index: 3; bottom: 12px; left: 14px;
    font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85);
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
  }
  .sheet-overview { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,.86); margin-bottom: 18px; }
  .sheet-actions { display: flex; gap: 10px; }
  .btn {
    flex: 1; height: 48px; border-radius: 16px;
    display: grid; place-items: center;
    font-size: 15.5px; font-weight: 700; cursor: pointer;
    border: .5px solid rgba(255,255,255,.28);
    background: rgba(255,255,255,.13);
    backdrop-filter: blur(20px) saturate(170%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform 320ms var(--ease-glass);
    color: var(--text);
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: rgba(255,55,95,.9); border-color: rgba(255,140,165,.7); }
  .btn.primary.off { background: rgba(255,255,255,.13); border-color: rgba(255,255,255,.28); }
</style>
</head>
<body>
<div class="stage">
<div>
  <div class="phone">
    <div class="wallpaper"></div>
    <div class="notch"></div>

    <div class="screen">
      <div class="status-bar">
        <span>9:41</span>
        <span class="status-icons"><span class="sig"></span>100%<span class="batt"></span></span></div>

      <div class="hdr">
        <div class="hdr-row">
          <div>
            <h1 id="pageTitle">Coming Soon</h1>
            <div class="hdr-sub" id="pageSub">Only G &amp; PG · next 6 months</div>
          </div>
        </div>
      </div>

      <div class="search-wrap" id="searchWrap" style="display:none">
        <div class="search glass-thin">
          <span>🔍</span>
          <input id="searchInput" placeholder="Search movies" autocomplete="off">
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <div class="scroll" id="content"></div>

      <div class="tabs glass" id="tabs">
        <div class="tab-pill" id="tabPill"></div>
      </div>
    </div>

    <div class="scrim" id="scrim"></div>
    <div class="sheet glass" id="sheet">
      <div class="grabber"></div>
      <div class="scroll"><div class="sheet-body" id="sheetBody"></div></div>
    </div>

    <div class="home-bar"></div>
  </div>

  <div class="caption">
    <b>Prototype A · Glass Timeline</b>
    Calm, list-first, very “iOS Settings meets IMDb”. Releases grouped under sticky glass
    month + date headers so you always know what lands when.
    <a href="index.html">← back to all prototypes</a>
  </div>
</div>
</div>

<script src="shared/data.js"></script>
<script>
(() => {
  Favorites.load();

  const TABS = [
    { id: 'soon', ic: '🎬', lb: 'Coming Soon' },
    { id: 'search', ic: '🔍', lb: 'Search' },
    { id: 'favs', ic: '♥', lb: 'Favorites' },
  ];

  const state = { tab: 'soon', filter: 'all', query: '' };

  const el = {
    tabs: document.getElementById('tabs'),
    pill: document.getElementById('tabPill'),
    content: document.getElementById('content'),
    chips: document.getElementById('chips'),
    title: document.getElementById('pageTitle'),
    sub: document.getElementById('pageSub'),
    searchWrap: document.getElementById('searchWrap'),
    searchInput: document.getElementById('searchInput'),
    scrim: document.getElementById('scrim'),
    sheet: document.getElementById('sheet'),
    sheetBody: document.getElementById('sheetBody'),
  };

  /* ---------- tab bar ---------- */
  for (const t of TABS) {
    const n = document.createElement('div');
    n.className = 'tab';
    n.dataset.tab = t.id;
    n.innerHTML = `<div class="ic">${t.ic}</div><div class="lb">${t.lb}</div>`;
    n.addEventListener('click', () => setTab(t.id));
    el.tabs.appendChild(n);
  }

  function movePill() {
    const active = el.tabs.querySelector('.tab.on');
    if (!active) return;
    el.pill.style.width = active.offsetWidth + 'px';
    el.pill.style.transform = `translateX(${active.offsetLeft - 7}px)`;
  }

  function setTab(id) {
    state.tab = id;
    for (const n of el.tabs.querySelectorAll('.tab')) n.classList.toggle('on', n.dataset.tab === id);
    movePill();

    el.searchWrap.style.display = id === 'search' ? 'block' : 'none';
    el.chips.style.display = id === 'search' ? 'none' : 'flex';

    if (id === 'soon') { el.title.textContent = 'Coming Soon'; el.sub.textContent = 'Only G & PG · next 6 months'; }
    if (id === 'search') { el.title.textContent = 'Search'; el.sub.textContent = 'Find any kid-safe movie'; el.searchInput.focus(); }
    if (id === 'favs') { el.title.textContent = 'Favorites'; el.sub.textContent = `${Favorites.ids.size} movies you're waiting for`; }

    render();
  }

  /* ---------- chips ---------- */
  const FILTERS = [
    { id: 'all', lb: 'All' },
    { id: 'G', lb: 'G only' },
    { id: 'PG', lb: 'PG' },
    { id: 'anim', lb: 'Animation' },
    { id: 'soonest', lb: 'Next 30 days' },
  ];
  for (const f of FILTERS) {
    const n = document.createElement('div');
    n.className = 'chip';
    n.dataset.f = f.id;
    n.textContent = f.lb;
    n.addEventListener('click', () => {
      state.filter = f.id;
      for (const c of el.chips.children) c.classList.toggle('on', c.dataset.f === f.id);
      render();
    });
    el.chips.appendChild(n);
  }
  el.chips.firstChild.classList.add('on');

  el.searchInput.addEventListener('input', (e) => {
    state.query = e.target.value.trim().toLowerCase();
    render();
  });

  /* ---------- filtering ---------- */
  function visible() {
    let list = MOVIES.slice().sort((a, b) => a.date.localeCompare(b.date));

    if (state.tab === 'favs') list = list.filter((m) => Favorites.has(m.id));

    if (state.tab === 'search') {
      if (!state.query) return [];
      return list.filter((m) =>
        m.title.toLowerCase().includes(state.query) ||
        m.genres.join(' ').toLowerCase().includes(state.query) ||
        m.studio.toLowerCase().includes(state.query));
    }

    switch (state.filter) {
      case 'G': return list.filter((m) => m.rating === 'G');
      case 'PG': return list.filter((m) => m.rating === 'PG');
      case 'anim': return list.filter((m) => m.genres.includes('Animation'));
      case 'soonest': return list.filter((m) => daysUntil(m.date) <= 45);
      default: return list;
    }
  }

  /* ---------- rendering ---------- */
  function cardNode(m, delay) {
    const n = document.createElement('div');
    n.className = 'card glass rise';
    n.style.animationDelay = delay + 'ms';
    n.innerHTML = `
      <div class="poster" style="${posterStyle(m)}">
        <div class="poster-emoji">${m.emoji}</div>
        <div class="poster-title">${m.title}</div>
      </div>
      <div class="card-info">
        <div class="card-title">${m.title}</div>
        <div class="card-meta">
          <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
          <span class="dot"></span><span>${m.runtime}m</span>
          <span class="dot"></span><span>⭐ ${(m.score / 10).toFixed(1)}</span>
        </div>
        <div class="card-genres">${m.genres.join(' · ')}</div>
      </div>
      <div class="fav-btn ${Favorites.has(m.id) ? 'on' : ''}">${Favorites.has(m.id) ? '♥' : '♡'}</div>`;

    const fav = n.querySelector('.fav-btn');
    fav.addEventListener('click', (e) => {
      e.stopPropagation();
      const on = Favorites.toggle(m.id);
      fav.classList.toggle('on', on);
      fav.textContent = on ? '♥' : '♡';
      fav.classList.remove('pop');
      void fav.offsetWidth;
      fav.classList.add('pop');
      if (state.tab === 'favs') setTimeout(render, 380);
      if (state.tab === 'favs' || true) el.sub.textContent =
        state.tab === 'favs' ? `${Favorites.ids.size} movies you're waiting for` : el.sub.textContent;
    });
    n.addEventListener('click', () => openSheet(m));
    return n;
  }

  function render() {
    const list = visible();
    el.content.innerHTML = '';

    if (!list.length) {
      const e = document.createElement('div');
      e.className = 'empty';
      const cfg = state.tab === 'favs'
        ? ['♡', 'No favorites yet', 'Tap the heart on any movie and it will show up here.']
        : state.tab === 'search' && !state.query
          ? ['🔍', 'Search for a movie', 'Try “dragon”, “animation”, or a studio name.']
          : ['🍿', 'Nothing matches', 'Try a different filter.'];
      e.innerHTML = `<div class="empty-emoji">${cfg[0]}</div>
        <div class="empty-title">${cfg[1]}</div><div class="empty-sub">${cfg[2]}</div>`;
      el.content.appendChild(e);
      return;
    }

    let i = 0;

    if (state.tab === 'search') {
      const wrap = document.createElement('div');
      wrap.className = 'date-group';
      wrap.style.paddingTop = '8px';
      for (const m of list) wrap.appendChild(cardNode(m, i++ * 35));
      el.content.appendChild(wrap);
      el.content.appendChild(spacer());
      return;
    }

    for (const month of groupByMonth(list)) {
      const h = document.createElement('div');
      h.className = 'month';
      h.textContent = month.label;
      el.content.appendChild(h);

      for (const day of groupByDate(month.items)) {
        const g = document.createElement('div');
        g.className = 'date-group';
        g.innerHTML = `<div class="date-head"><span class="d">${day.label}</span>
          <span class="n">in ${day.sub}</span></div>`;
        for (const m of day.items) g.appendChild(cardNode(m, i++ * 35));
        el.content.appendChild(g);
      }
    }
    el.content.appendChild(spacer());
  }

  function spacer() {
    const s = document.createElement('div');
    s.style.height = '18px';
    return s;
  }

  /* ---------- detail sheet ---------- */
  function openSheet(m) {
    const on = Favorites.has(m.id);
    el.sheetBody.innerHTML = `
      <div class="sheet-hero">
        <div class="poster" style="${posterStyle(m)}">
          <div class="poster-emoji">${m.emoji}</div>
          <div class="poster-title">${m.title}</div>
        </div>
        <div>
          <div class="sheet-title">${m.title}</div>
          <div class="sheet-meta">
            <span class="rating ${m.rating.toLowerCase()}">${m.rating}</span>
            &nbsp; ${m.runtime} min<br>
            ${formatDate(m.date)}, ${m.date.slice(0, 4)}<br>
            ${m.genres.join(' · ')}<br>
            ${m.studio}
          </div>
        </div>
      </div>
      <div class="trailer" style="${posterStyle(m)}">
        <div class="trailer-play">▶</div>
        <div class="trailer-label">Official Trailer · 2:14</div>
      </div>
      <div class="sheet-overview">${m.overview}</div>
      <div class="sheet-actions">
        <div class="btn primary ${on ? '' : 'off'}" id="favBtn">${on ? '♥  Favorited' : '♡  Add to Favorites'}</div>
        <div class="btn" style="flex:0 0 60px" title="Share">↗</div>
      </div>`;

    el.sheetBody.querySelector('#favBtn').addEventListener('click', (e) => {
      const nowOn = Favorites.toggle(m.id);
      e.currentTarget.classList.toggle('off', !nowOn);
      e.currentTarget.textContent = nowOn ? '♥  Favorited' : '♡  Add to Favorites';
      render();
    });
    el.sheetBody.querySelector('.trailer').addEventListener('click', (e) => {
      const lb = e.currentTarget.querySelector('.trailer-label');
      lb.textContent = 'Playing trailer… (YouTube in the real app)';
    });

    el.scrim.classList.add('on');
    el.sheet.classList.add('on');
  }

  function closeSheet() {
    el.scrim.classList.remove('on');
    el.sheet.classList.remove('on');
  }
  el.scrim.addEventListener('click', closeSheet);

  setTab('soon');
  window.addEventListener('resize', movePill);
})();
</script>
</body>
</html>
